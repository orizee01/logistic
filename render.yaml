# Render blueprint: API + Postgres + static React site.
databases:
  - name: logistic-db
    plan: free

services:
  - type: web
    name: logistic-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate:prod
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: logistic-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

  - type: web
    name: logistic-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
